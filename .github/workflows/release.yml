name: Release
run-name: "Release ${{ github.event.release.tag_name }}"

on:
  release:
    types: [published]

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Read release
        id: release
        env:
          BODY: ${{ github.event.release.body }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [[ "$BODY" == *"[Short subtitle]"* || "$BODY" == *"[1-2 sentence summary"* ]]; then
            echo "::error::Release $TAG still has the subtitle or summary placeholder of the draft; fill in .github/release-notes.md or edit the release, then run this workflow again."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: resolve
    permissions:
      contents: read
      checks: write
    uses: ./.github/workflows/reusable-verify.yml
    with:
      ref: ${{ needs.resolve.outputs.tag }}
      version: ${{ needs.resolve.outputs.tag }}
      distribution: true

  publish:
    name: Publish
    needs: verify
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/reusable-publish.yml
    with:
      commit: ${{ needs.verify.outputs.commit }}
      version: ${{ needs.verify.outputs.version }}

  attach:
    name: Attach Yui.jar to the release
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: yui-${{ needs.verify.outputs.version }}
          path: distribution

      - name: Upload Yui.jar
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mv distribution/Yui.jar "distribution/Yui-$VERSION.jar"
          gh release upload "$TAG" distribution/* --clobber --repo "$GITHUB_REPOSITORY"

name: Build cache
run-name: "Build cache of ${{ github.ref_name }}"

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: build-cache-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests read the caches of dev but never write them, so without this job the checks would compile
  # everything and download every dependency again.
  compile:
    name: Prepare for the checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: whereareiam/devops/primitive/setup/gradle@v3

      - name: Compile the project and its tests
        run: ./gradlew --no-daemon testClasses bootJar
